<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — ScentCrown</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/customer.css"><script defer src="/js/app.js"></script><script defer src="/js/auth.js"></script></head>
<body><header id="site-header"></header><main class="page-main"><div class="auth-layout"><div class="auth-visual"><p>“A fragrance is the punctuation at the end of your presence.”</p></div><section class="auth-box"><p class="eyebrow">YOUR SCENTCROWN ACCOUNT</p><h1 id="auth-title">Welcome back</h1><p>Sign in to see your orders and keep your favourites close.</p><form id="auth-form" class="auth-form"><label id="name-field" hidden>Your name<input name="name" autocomplete="name" minlength="2" maxlength="100"></label><label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required></label><button class="button button-dark">Sign in</button></form><p class="auth-switch" id="auth-switch"></p></section></div></main><footer id="site-footer" class="site-footer"></footer></body></html>
