<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout — ScentCrown</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/customer.css"><script defer src="/js/app.js"></script><script defer src="/js/checkout.js"></script></head>
<body><header id="site-header"></header><main class="page-main container section"><p class="eyebrow">ALMOST YOURS</p><h1 style="font-size:48px">Checkout</h1><div class="checkout-layout"><form id="checkout-form" class="checkout-form"><h2>Delivery details</h2><label>Recipient name<input name="name" autocomplete="name" minlength="2" maxlength="100" required></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" minlength="6" maxlength="30" required></label><label>Delivery address<textarea name="address" autocomplete="street-address" minlength="8" maxlength="500" required></textarea></label><button class="button button-dark">Place order</button><p class="fine-print">Payment is collected when your order arrives.</p></form><aside class="summary-card"><h2>Your order</h2><div id="checkout-summary"><p class="empty-state">Loading your order…</p></div><p class="fine-print">Cash on delivery</p></aside></div></main><footer id="site-footer" class="site-footer"></footer></body></html>
